<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Smart Factory MES</title>
    <!-- 1. Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-10 font-sans">
<div class="max-w-6xl mx-auto space-y-6">

    <!-- 상단 헤더 -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-800 pb-5">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-sky-400 tracking-tight">🏭 Mini Smart Factory MES</h1>
            <p class="text-slate-400 text-sm mt-1">실시간 작업지시 통제 및 라인 가동 현황 대시보드</p>
        </div>
        <button id="refreshBtn" class="mt-3 md:mt-0 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 transition">
            🔄 데이터 새로고침
        </button>
    </header>

    <!-- 상단 KPI 요약 카드 4개 -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <p class="text-xs text-slate-400 uppercase font-semibold">전체 작업지시</p>
            <p id="kpiTotal" class="text-2xl font-bold text-white mt-1">0</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <p class="text-xs text-emerald-400 uppercase font-semibold">현재 가동중 (RUNNING)</p>
            <p id="kpiRunning" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <p class="text-xs text-amber-400 uppercase font-semibold">일시 정지 (STOPPED)</p>
            <p id="kpiStopped" class="text-2xl font-bold text-amber-400 mt-1">0</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <p class="text-xs text-indigo-400 uppercase font-semibold">생산 완료 (COMPLETED)</p>
            <p id="kpiCompleted" class="text-2xl font-bold text-indigo-400 mt-1">0</p>
        </div>
    </section>

    <!-- 중단: 작업지시 등록 폼(좌측) + 실시간 상태 그래프(우측) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 등록 폼 -->
        <section class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-white mb-4">새 작업지시 발행</h2>
                <form id="createForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">작업지시 번호</label>
                        <input type="text" id="workOrderNo" placeholder="예: WO-002" required
                               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">제품 코드</label>
                        <input type="text" id="productType" placeholder="예: BLUE_TOKEN" required
                               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">목표 수량 (EA)</label>
                        <input type="number" id="targetQty" placeholder="예: 50" min="1" required
                               class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
                    </div>
                    <div class="md:col-span-3 flex justify-end mt-2">
                        <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition shadow-lg shadow-sky-950/50">
                            + 작업지시 등록
                        </button>
                    </div>
                </form>
            </div>
            <p class="text-xs text-slate-500 mt-4">* 등록 즉시 DB에 적재되며 대기(READY) 상태로 전환됩니다.</p>
        </section>

        <!-- 실시간 상태 그래프 -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center">
            <h2 class="text-sm font-semibold text-slate-300 self-start mb-2">라인 상태 분포</h2>
            <div class="w-48 h-48">
                <canvas id="statusChart"></canvas>
            </div>
        </section>
    </div>

    <!-- 하단: 작업지시 통제 테이블 -->
    <section class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-800">
            <h2 class="text-lg font-semibold text-white">작업지시 실시간 통제 목록</h2>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-slate-950/60 text-slate-400 text-xs uppercase border-b border-slate-800">
                    <th class="py-3.5 px-6">ID</th>
                    <th class="py-3.5 px-6">지시번호</th>
                    <th class="py-3.5 px-6">제품코드</th>
                    <th class="py-3.5 px-6">생산현황 (양품/목표)</th>
                    <th class="py-3.5 px-6">가동 / 종료 시각</th>
                    <th class="py-3.5 px-6">현재상태</th>
                    <th class="py-3.5 px-6 text-right">설비 가동 제어</th>
                </tr>
                </thead>
                <tbody id="workOrderBody" class="divide-y divide-slate-800 text-sm">
                </tbody>
            </table>
        </div>
    </section>

</div>

<script src="/app.js"></script>
</body>
</html>
